services:
  db:
    image: mysql:9.7
    container_name: spp-mysql
    # Never auto-start on boot or after a crash: the DB runs only while
    # `docker compose up` is running in this folder.
    restart: "no"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      # Created automatically on first start
      MYSQL_DATABASE: ${MYSQL_DATABASE:-AppDb}
    volumes:
      # Keeps data between restarts; survives `docker compose down`.
      # Remove it with `docker compose down -v` to start from scratch.
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
