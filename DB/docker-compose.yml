services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: spp-mssql
    restart: "no"
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - mssql_data:/var/opt/mssql

volumes:
  mssql_data:
